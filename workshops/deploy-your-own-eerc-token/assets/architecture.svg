<svg xmlns="http://www.w3.org/2000/svg" width="640" height="215" viewBox="0 0 640 215" font-family="system-ui, sans-serif" font-size="14">
  <text x="202" y="62" text-anchor="middle" fill="#333" font-size="12">proof</text>
  <text x="437" y="62" text-anchor="middle" fill="#333" font-size="12">verifyProof</text>
  <rect x="15" y="72" width="140" height="82" rx="8" fill="#fff" stroke="#e84142" stroke-width="2"/>
  <text x="85" y="100" text-anchor="middle" font-weight="bold">Client</text>
  <text x="85" y="120" text-anchor="middle" fill="#555" font-size="12">BabyJubJub key</text>
  <text x="85" y="138" text-anchor="middle" fill="#555" font-size="12">proof generation</text>
  <rect x="250" y="72" width="140" height="82" rx="8" fill="#fff" stroke="#e84142" stroke-width="2"/>
  <text x="320" y="100" text-anchor="middle" font-weight="bold">EncryptedERC</text>
  <text x="320" y="120" text-anchor="middle" fill="#555" font-size="12">encrypted balances</text>
  <text x="320" y="138" text-anchor="middle" fill="#555" font-size="12">rules, no secrets</text>
  <rect x="485" y="72" width="140" height="82" rx="8" fill="#fff" stroke="#e84142" stroke-width="2"/>
  <text x="555" y="100" text-anchor="middle" font-weight="bold">Verifiers</text>
