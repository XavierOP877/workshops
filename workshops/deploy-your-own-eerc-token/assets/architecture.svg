  <text x="555" y="138" text-anchor="middle" fill="#555" font-size="12">pairing check only</text>
  <line x1="167" y1="113" x2="238" y2="113" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="402" y1="113" x2="473" y2="113" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
  <text x="320" y="184" text-anchor="middle" fill="#555" font-size="12">The private key stays in the client. The chain stores ciphertexts and checks proofs.</text>
  <text x="320" y="202" text-anchor="middle" fill="#555" font-size="12">Neither contract can read a balance.</text>
